name: Update profile cards

# Re-fetches the public contribution calendar and redraws every card once a day.

"on":
  schedule:
    - cron: "23 1 * * *"   # 01:23 UTC, about 09:23 in Singapore
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**", "fonts/**"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contribution calendar
        run: python scripts/contrib.py

      - name: Render cards
        run: python scripts/render.py

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards/
          git diff --cached --quiet && exit 0
          git commit -m "chore(cards): refresh contribution cards [skip ci]"
          git push
