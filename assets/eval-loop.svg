<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img" aria-label="How I improve agents: real failures, eval sets and graders, regression gates, post-training, then back to failures">
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; }
    .step { fill: #6366f1; font: 700 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1.2px; }
    .title { fill: #0d1117; font: 650 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .body { fill: #57606a; font: 400 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .arrow { stroke: #8c959f; fill: none; }
    .head { fill: #8c959f; }
    .loop { fill: #57606a; font: 500 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .title { fill: #f0f6fc; }
      .body { fill: #8b949e; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
      .loop { fill: #8b949e; }
    }
  </style>

  <!-- cards -->
  <g>
    <rect class="card" x="1" y="10" width="190" height="140" rx="12"/>
    <text class="step" x="20" y="38">01 · OBSERVE</text>
    <text class="title" x="20" y="64">Real failures</text>
    <text class="body" x="20" y="90">Read full traces</text>
    <text class="body" x="20" y="108">Failure-mode taxonomies</text>
    <text class="body" x="20" y="126">"Feels dumb" → a label</text>
  </g>
  <g>
    <rect class="card" x="230" y="10" width="190" height="140" rx="12"/>
    <text class="step" x="249" y="38">02 · MEASURE</text>
    <text class="title" x="249" y="64">Evals &amp; graders</text>
    <text class="body" x="249" y="90">Held-out sets from usage</text>
    <text class="body" x="249" y="108">LLM judges, calibrated</text>
    <text class="body" x="249" y="126">against outcomes</text>
  </g>
  <g>
    <rect class="card" x="459" y="10" width="190" height="140" rx="12"/>
    <text class="step" x="478" y="38">03 · GATE</text>
    <text class="title" x="478" y="64">Regression bar</text>
    <text class="body" x="478" y="90">Pre-registered pass/fail</text>
    <text class="body" x="478" y="108">Paired A/B, leakage checks</text>
    <text class="body" x="478" y="126">Quality vs. cost tracked</text>
  </g>
  <g>
    <rect class="card" x="688" y="10" width="190" height="140" rx="12"/>
    <text class="step" x="707" y="38">04 · IMPROVE</text>
    <text class="title" x="707" y="64">Ship the fix</text>
    <text class="body" x="707" y="90">SFT · GRPO · distillation</text>
    <text class="body" x="707" y="108">Prompts, harness, model</text>
    <text class="body" x="707" y="126">choice — whatever moves it</text>
  </g>

  <!-- forward arrows -->
  <g class="arrow" stroke-width="1.8">
    <path d="M195 80 H222"/><path d="M424 80 H451"/><path d="M653 80 H680"/>
  </g>
  <g class="head">
    <path d="M226 80 l-8 -5 v10 z"/><path d="M455 80 l-8 -5 v10 z"/><path d="M684 80 l-8 -5 v10 z"/>
  </g>

  <!-- loop back -->
  <path class="arrow" stroke-width="1.8" stroke-dasharray="5 5" d="M783 154 V196 Q783 206 773 206 H106 Q96 206 96 196 V162"/>
  <path class="head" d="M96 155 l-5 9 h10 z"/>
  <text class="loop" x="440" y="222" text-anchor="middle">new failures become new eval cases</text>
</svg>
