<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img" aria-label="Arav Behl — Applied ML Engineer, agent evals and post-training">
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .name { fill: #0d1117; font: 700 40px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -0.5px; }
    .role { fill: #57606a; font: 500 17px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .chip { fill: #f6f8fa; stroke: #d0d7de; }
    .chiptxt { fill: #24292f; font: 500 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .accent { fill: #6366f1; }
    .grid { stroke: #eaeef2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .name { fill: #f0f6fc; }
      .role { fill: #8b949e; }
      .chip { fill: #161b22; stroke: #30363d; }
      .chiptxt { fill: #c9d1d9; }
      .grid { stroke: #161b22; }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="879" height="189" rx="14"/>
  <g class="grid" stroke-width="1">
    <path d="M620 1 V189 M660 1 V189 M700 1 V189 M740 1 V189 M780 1 V189 M820 1 V189 M860 1 V189"/>
    <path d="M600 40 H879 M600 80 H879 M600 120 H879 M600 160 H879"/>
  </g>
  <!-- eval curve motif -->
  <polyline points="620,150 660,138 700,141 740,112 780,98 820,70 860,52" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="620,150 660,147 700,149 740,140 780,139 820,131 860,128" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round"/>
  <circle class="accent" cx="860" cy="52" r="5"/>
  <rect class="accent" x="40" y="44" width="6" height="44" rx="3"/>
  <text class="name" x="60" y="80">Arav Behl</text>
  <text class="role" x="40" y="116">Applied ML Engineer · Agent Evals &amp; Post-Training</text>
  <g>
    <rect class="chip" x="40" y="136" width="128" height="30" rx="15"/>
    <text class="chiptxt" x="104" y="156" text-anchor="middle">LLM-as-judge</text>
    <rect class="chip" x="178" y="136" width="146" height="30" rx="15"/>
    <text class="chiptxt" x="251" y="156" text-anchor="middle">Regression gates</text>
    <rect class="chip" x="334" y="136" width="112" height="30" rx="15"/>
    <text class="chiptxt" x="390" y="156" text-anchor="middle">SFT · GRPO</text>
    <rect class="chip" x="456" y="136" width="120" height="30" rx="15"/>
    <text class="chiptxt" x="516" y="156" text-anchor="middle">Agent systems</text>
  </g>
</svg>
