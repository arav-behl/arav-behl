<svg xmlns="http://www.w3.org/2000/svg" width="293.333" height="190" viewBox="0 0 293.333 190" role="img" aria-label="Crypto Order Book: Limit order book in Rust, matching against live Binance market data."><title>Crypto Order Book: Limit order book in Rust, matching against live Binance market data.</title><style>@font-face{font-family:'Geist';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist Mono';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
