<svg xmlns="http://www.w3.org/2000/svg" width="880" height="84" viewBox="0 0 880 84" role="img" aria-label="What I've built"><title>What I've built</title><style>@font-face{font-family:'Instrument Serif';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Instrument Serif';font-style:italic;src:url(data:font/woff2;base64,) format('woff2')}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade 1.2s ease both}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.7,.2,1) both}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.serif{font-family:'Instrument Serif',Georgia,serif}
.italic{font-style:italic}
.sans{font-family:'Geist',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:'Geist Mono',ui-monospace,Menlo,monospace;letter-spacing:.08em}
.t{fill:#16150f}.i{fill:#d9472b}@media (prefers-color-scheme:dark){.t{fill:#f0eee8}}</style><text x="4" y="58" class="serif rise t" font-size="44">What I've <tspan class="italic i">built</tspan></text></svg>